plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"        // Plugin Flutter
    id "com.google.gms.google-services"           // Plugin Google Services (Firebase)
}

// 🛡️ ESTRATEGIA DE RESOLUCIÓN (Solución al error CheckAarMetadata)
// Forzamos versiones estables que NO requieren AGP 8.9.1+
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
    // Avoid Play Core duplicate classes when Firebase Auth brings core-common transitively.
    exclude group: 'com.google.android.play', module: 'core-common'
}

android {
    namespace = "com.billnance.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("key.properties")
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    defaultConfig {
        applicationId = "com.billnance.app"
        minSdkVersion 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // 🔹 Habilitar desugaring
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Importa BoM de Firebase (última versión estable)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation('com.google.android.gms:play-services-auth:21.2.0') {
        exclude group: 'com.google.android.play', module: 'core-common'
    }

    // Firebase
    implementation 'com.google.firebase:firebase-analytics'
    implementation('com.google.firebase:firebase-auth') {
        exclude group: 'com.google.android.play', module: 'core-common'
    }
    implementation 'com.google.android.play:core:1.10.3'

    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    // 🔹 Dependencia necesaria para desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}